<p style="color:var(--mut);font-size:13px;text-align:center">Tap card or press Space to flip. Arrow keys to move.</p></div><script>
const D=[{"t":"1 Rise of the Nazis 1919-33","f":"How did Hitler enter politics after WWI?","b":"Joined the small German Workers' Party (1919) and quickly influenced its propaganda and ideas.<br>Party renamed NSDAP; Hitler leader from 1921."},{"t":"1 Rise of the Nazis 1919-33","f":"What was the Twenty-Five Point Programme (1920)?","b":"• Abolish the Treaty of Versailles<br>• Expand borders to gain living space (Lebensraum)<br>• Anti-Jewish policies"},{"t":"1 Rise of the Nazis 1919-33","f":"What was the early role of the SA?","b":"A protective organisation for the NSDAP and a purposefully disruptive force in German politics."},{"t":"1 Rise of the Nazis 1919-33","f":"Why did Hitler attempt the Munich Putsch (Nov 1923)?","b":"The crises of 1923 (Ruhr occupation, hyperinflation) gave him the context to try to overthrow the Weimar government."},{"t":"1 Rise of the Nazis 1919-33","f":"Key events of the Munich Putsch","b":"• Beer hall meeting<br>• Forced support, then withdrawn<br>• Attempted march into Munich failed<br>• Hitler arrested"},{"t":"1 Rise of the Nazis 1919-33","f":"Consequences of the Munich Putsch","b":"Short term: NSDAP banned.<br>Long term: publicity, Hitler wrote Mein Kampf, and he changed the party's approach."},{"t":"1 Rise of the Nazis 1919-33","f":"Why was Nazi support limited 1924-28?","b":"Economic recovery and political stability reduced support, which led to the party's reorganisation."},{"t":"1 Rise of the Nazis 1919-33","f":"Why is Mein Kampf important?","b":"Set out Hitler's key ideas, e.g. his attitude towards Jews (published 1925)."},{"t":"1 Rise of the Nazis 1919-33","f":"Significance of the Bamberg Conference (1926)?","b":"Confirmed Hitler's position within the NSDAP and shaped the formulation of key policies."},{"t":"1 Rise of the Nazis 1919-33","f":"Impact of the Wall Street Crash (1929) in Germany","b":"American loans recalled and banks closed, so unemployment rose rapidly."},{"t":"1 Rise of the Nazis 1919-33","f":"Why did Nazi support grow 1929-32?","b":"• Rapidly rising unemployment<br>• Weak governments unable to deal with it<br>• Hitler's appeal as a strong leader<br>• Propaganda aimed at specific groups<br>• Work of the SA"},{"t":"1 Rise of the Nazis 1919-33","f":"Who else gained support 1929-32?","b":"Both right-wing and left-wing parties, including the Communist Party."},{"t":"1 Rise of the Nazis 1919-33","f":"What happened in the July 1932 election?","b":"The NSDAP became the largest party in the Reichstag."},{"t":"1 Rise of the Nazis 1919-33","f":"Key political developments in 1932","b":"• Brüning's decree banning SA/SS; he is removed by von Schleicher<br>• Von Papen becomes Chancellor; coalition includes NSDAP<br>• Hitler's demands to Hindenburg refused<br>• Nov election; Papen resigns; Schleicher Chancellor"},{"t":"1 Rise of the Nazis 1919-33","f":"Why was Hitler appointed Chancellor (Jan 1933)?","b":"Hindenburg and von Papen decided to make him Chancellor, believing they could control him."},{"t":"2 Weimar crisis 1918-23","f":"Germany by Nov 1918: what led to the Republic?","b":"Hardship and unrest; mutinies and revolts (the 'German revolution') led to the Kaiser's abdication, Ebert signing the armistice and a democratic government."},{"t":"2 Weimar crisis 1918-23","f":"Constitution: features to judge as strengths or weaknesses","b":"• Wide franchise<br>• Checks and balances<br>• Proportional representation<br>• Article 48 (emergency powers)"},{"t":"2 Weimar crisis 1918-23","f":"Key terms of the Treaty of Versailles","b":"• War Guilt clause<br>• Territorial: loss of land<br>• Military: reduced forces<br>• Financial/economic: reparations"},{"t":"2 Weimar crisis 1918-23","f":"Why was the Republic unpopular early on?","b":"The right wing felt the government had betrayed Germany by accepting Versailles; the 'stab in the back' theory; the treaty terms."},{"t":"2 Weimar crisis 1918-23","f":"What was the 'stab in the back' theory?","b":"The belief that the Weimar government had betrayed Germany."},{"t":"2 Weimar crisis 1918-23","f":"Spartacists (Jan 1919)","b":"Left-wing communist uprising. The government relied on the Freikorps to keep control."},{"t":"2 Weimar crisis 1918-23","f":"Kapp Putsch (1920)","b":"Right-wing attempt to seize power, with Freikorps involvement. Shows opposition came from both Left and Right."},{"t":"2 Weimar crisis 1918-23","f":"Why did France occupy the Ruhr (Jan 1923)?","b":"Germany could not keep up reparations payments."},{"t":"2 Weimar crisis 1918-23","f":"Effects of the Ruhr occupation","b":"Passive resistance, economic damage for Germany, and worsening inflation."},{"t":"2 Weimar crisis 1918-23","f":"What led to hyperinflation?","b":"Reparations and the Ruhr occupation, with the government printing more money."},{"t":"2 Weimar crisis 1918-23","f":"Consequences of hyperinflation","b":"Affected different groups in society differently, e.g. savings wiped out and money spent immediately on goods (2025 Q1)."},{"t":"3 Nazi control 1933-39","f":"Reichstag Fire (Feb 1933): how did Hitler use it?","b":"• Accused communists of a conspiracy<br>• State of emergency<br>• Decree for the Protection of the People and State removed opposition<br>• March 1933 election gave Hitler a majority"},{"t":"3 Nazi control 1933-39","f":"Enabling Act (1933)","b":"Changed the constitution and gave Hitler sweeping powers."},{"t":"3 Nazi control 1933-39","f":"Bans in 1933","b":"Trade unions and strikes banned (May); other political parties banned (July)."},{"t":"3 Nazi control 1933-39","f":"Röhm and the Night of the Long Knives (June 1934)","b":"Röhm led the SA and opposed Hitler's policies; army and SS warned Hitler. Röhm and other SA leaders were arrested and murdered, securing Hitler's position."},{"t":"3 Nazi control 1933-39","f":"What happened when Hindenburg died (Aug 1934)?","b":"Hitler declared himself Führer, added to his powers and made all soldiers swear an oath of loyalty."},{"t":"3 Nazi control 1933-39","f":"The SS","b":"Loyal to Hitler; grew under Himmler in the 1930s; removed opposition to the Nazis."},{"t":"3 Nazi control 1933-39","f":"The Gestapo","b":"Secret police under Göring then Heydrich; could arrest without trial."},{"t":"3 Nazi control 1933-39","f":"The SD","b":"The Nazi security service."},{"t":"3 Nazi control 1933-39","f":"Concentration camps","b":"Held political prisoners and 'undesirables'. First camp: Dachau (March 1933)."},{"t":"3 Nazi control 1933-39","f":"How did the Nazis control the legal system?","b":"Judges had to join the National Socialist League for the Maintenance of the Law; the People's Court was set up."},{"t":"3 Nazi control 1933-39","f":"Nazi control of the Catholic Church","b":"Concordat with the Pope, then undermined: churches closed, moves against Catholic schools, Catholic Youth banned."},{"t":"3 Nazi control 1933-39","f":"Nazi control of the Protestant Church","b":"Reich Church formed under Nazi leadership."},{"t":"3 Nazi control 1933-39","f":"Goebbels' role","b":"Minister for Propaganda: used censorship to ban opposed ideas and promoted Nazi ideology."},{"t":"3 Nazi control 1933-39","f":"Propaganda through media","b":"Control of newspapers and radio broadcasts; mass production of cheap radios."},{"t":"3 Nazi control 1933-39","f":"Propaganda: rallies, sport and the 1936 Berlin Olympics","b":"Image control through rallies and sport; the Olympics showcased Germany and its successes."},{"t":"3 Nazi control 1933-39","f":"Nazi control of culture","b":"Reich Chamber of Culture controlled what was published/performed<br>• Book burning<br>• Film and newsreels controlled<br>• 'Degenerate' art and jazz suppressed<br>• Architecture, e.g. Albert Speer"},{"t":"3 Nazi control 1933-39","f":"Church opposition","b":"Pastor Niemöller and the Confessional Church."},{"t":"4 Youth and education","f":"Aims of the Hitler Youth and League of German Maidens","b":"Encourage loyalty to the regime: prepare boys for military roles and girls for domestic roles."},{"t":"4 Youth and education","f":"How did the Nazis control teachers?","b":"Through the Nazi teachers' union; non-compliant teachers were removed."},{"t":"4 Youth and education","f":"How did the Nazis change the curriculum?","b":"Added Race Studies, emphasised physical education, controlled textbooks."},{"t":"4 Youth and education","f":"Youth opposition: Swing Youth and Edelweiss Pirates","b":"Did not support the Nazi youth movements; rejected Nazi values; activities included listening to banned music."},{"t":"5 Employment and living standards","f":"How did the Nazis reduce unemployment?","b":"• Labour service (temporary, then compulsory)<br>• Autobahns<br>• Rearmament demands"},{"t":"5 Employment and living standards","f":"Invisible unemployment","b":"Women, Jews and others were not counted in unemployment figures."},{"t":"5 Employment and living standards","f":"German Labour Front","b":"Replaced the banned trade unions."},{"t":"5 Employment and living standards","f":"Strength Through Joy","b":"Leisure activities and holidays for workers."},{"t":"5 Employment and living standards","f":"Beauty of Labour","b":"Improved working conditions, e.g. cleanliness, facilities, meals."},{"t":"5 Employment and living standards","f":"Did all workers benefit?","b":"Living standards improved for many workers, but you must judge the extent to which all benefited (e.g. invisible unemployment, loss of unions)."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Why did Germany recover economically 1924-29?","b":"Stresemann's work, the Rentenmark, Dawes and Young Plans, and American loans."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Rentenmark (1923)","b":"Introduced to tackle hyperinflation."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Dawes Plan (1924) and Young Plan (1929)","b":"Dealt with reparations; US loans were available."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Locarno Pact (1925)","b":"Agreed borders and paved the way for Germany to join the League of Nations (1926)."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Kellogg-Briand Pact (1928)","b":"Part of Stresemann's work improving Germany's international relations."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Effect of Stresemann's achievements on politics at home","b":"Less political opposition to Weimar and reduced support for extremism."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Standard of living 1924-29","b":"Real wage rises for many; new housing built; benefits for the unemployed."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Women in the 1920s","b":"More employment, political participation (including the vote) and freedom in leisure."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Weimar art and architecture","b":"Bauhaus; individuals such as Paul Klee and Otto Dix."},{"t":"6 Stresemann and Weimar culture 1924-29","f":"Weimar cinema","b":"Expressionism; individuals such as Marlene Dietrich."}];let f='All',L=D,i=0;const $=id=>document.getElementById(id);function tabs(){const ts=['All',...new Set(D.map(c=>c.t))];$('tabs').innerHTML='';ts.forEach(t=>{const b=document.createElement('button');b.textContent=t==='All'?'All ('+D.length+')':t;b.className=t===f?'on':'';b.onclick=()=>{f=t;L=t==='All'?D.slice():D.filter(c=>c.t===t);i=0;tabs();show(false)};$('tabs').appendChild(b)})}function show(flip){const c=L[i];$('card').innerHTML='<div class="tag">'+c.t+'</div><div class="q">'+c.f+'</div>'+(flip?'<div class="a">'+c.b+'</div>':'');$('card').dataset.f=flip?1:0;$('n').textContent=(i+1)+' / '+L.length}function flip() {show($('card').dataset.f!=='1')}function go(d){i=(i+d+L.length)%L.length;show(false)}$('card').onclick=flip;$('p').onclick=()=>go(-1);$('x').onclick=()=>go(1);$('s').onclick=()=>{L=L.slice().sort(()=>Math.random()-.5);i=0;show(false)};document.onkeydown=e=>{if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)};tabs();show(false);
</script></body></html>
